<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08161f">
<title>Abby's Shift</title>
<style>
:root{--bg:#08161f;--panel:#10242f;--panel2:#16303e;--line:#23424f;--tx:#e8f3f5;--mut:#8fb0b8;--acc:#19c3b0;--acc2:#0f8f82;--bad:#ff4d5e;--warn:#ffb347;--good:#52d98a;--doc:#6aa9ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,Roboto,"Segoe UI",sans-serif;overscroll-behavior:none}
#app{max-width:640px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 90px)}
h1,h2,h3{margin:0 0 6px}h1{font-size:30px;letter-spacing:.5px}h2{font-size:19px}h3{font-size:15px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;margin-top:16px}
p{margin:6px 0}.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}
button{font:inherit;color:inherit;border:0;border-radius:12px;padding:12px 14px;background:var(--panel2);text-align:left;width:100%}
button:active{transform:scale(.985)}button[disabled]{opacity:.45}
.btn{background:var(--acc);color:#04201d;font-weight:700;text-align:center;font-size:16px}
.btn.sec{background:var(--panel2);color:var(--tx);font-weight:600}.btn.danger{background:var(--bad);color:#fff}
.hud{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 82%,transparent);padding:4px 0 8px}
.hudrow{display:flex;gap:8px;align-items:center;justify-content:space-between}
.clock{font:700 26px/1 ui-monospace,Menlo,monospace;color:var(--acc);letter-spacing:1px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12px;white-space:nowrap}
.bar{height:5px;background:var(--panel);border-radius:3px;overflow:hidden;margin-top:6px}.bar>i{display:block;height:100%;background:var(--acc)}
.meters{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
.bed{position:relative;cursor:pointer;display:block;width:100%}
.bed.alert{border-color:var(--warn);animation:pulse 1.2s infinite}.bed.crit{border-color:var(--bad)}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(255,179,71,.35)}}
.bn{position:absolute;top:10px;right:12px;font:700 12px ui-monospace,monospace;color:var(--mut)}
.bed .nm{font-weight:700;font-size:16px;padding-right:44px}.bed .look{margin:6px 0;color:#cfe4e8}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--mut)}
.chip.mon{color:var(--acc);border-color:var(--acc2)}.chip.bad{color:var(--bad);border-color:var(--bad)}.chip.good{color:var(--good);border-color:var(--good)}.chip.warn{color:var(--warn);border-color:var(--warn)}
.empty{opacity:.55;text-align:center;padding:18px}
.feed{margin-top:14px}.note{padding:7px 10px;border-left:3px solid var(--line);margin:5px 0;background:var(--panel);border-radius:0 10px 10px 0;font-size:13.5px}
.note b.t{font:600 11px ui-monospace,monospace;color:var(--mut);margin-right:6px}
.note.warn{border-color:var(--warn)}.note.alarm,.note.bad{border-color:var(--bad)}.note.good{border-color:var(--good)}.note.doc{border-color:var(--doc)}
.toasts{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 6px);z-index:50;pointer-events:none;max-width:624px;margin:0 auto}
.toast{font-size:12.5px;pointer-events:auto;background:#0d2d3a;border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:12px;padding:9px 12px;margin-bottom:6px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.5);animation:in .2s}
.toast.warn{border-left-color:var(--warn)}.toast.alarm,.toast.bad{border-left-color:var(--bad);background:#34121a}.toast.good{border-left-color:var(--good)}.toast.doc{border-left-color:var(--doc)}
@keyframes in{from{transform:translateY(-10px);opacity:0}}
.top{display:flex;gap:8px;align-items:center;margin-bottom:6px}.top button{width:auto;padding:8px 12px}
.vit{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.v{background:var(--panel2);border-radius:12px;padding:8px;text-align:center}
.v b{display:block;font:700 22px ui-monospace,monospace}.v span{font-size:11px;color:var(--mut);text-transform:uppercase}.v.w b{color:var(--warn)}.v.r b{color:var(--bad)}
canvas.ecg{width:100%;height:70px;background:#031017;border-radius:10px;display:block;margin-bottom:8px}
.act{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:6px 0}.act .l{flex:1}.act .m{font-size:12px;color:var(--mut);white-space:nowrap;text-align:right}
.act.ord .m em{color:var(--good);font-style:normal}.act.ord.no .m em{color:var(--warn)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end}.sheet>div{background:var(--panel);width:100%;max-width:640px;margin:0 auto;border-radius:20px 20px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 16px)}
.sel{border:2px solid var(--line);background:var(--panel2)}.sel.on{border-color:var(--acc);background:#0d3a3a}
.fact{display:block;margin:5px 0;padding:10px 12px}.fact .g{display:inline-block;width:20px;color:var(--acc);font-weight:800}
.docc{display:flex;gap:10px;align-items:center}.trust{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:4px;width:110px}.trust i{display:block;height:100%}
.rank{font:800 76px/1 ui-monospace,monospace;text-align:center;margin:8px 0;color:var(--acc)}
.kv{display:flex;justify-content:space-between;margin:3px 0}.hit{color:var(--good)}.miss{color:var(--bad)}
.out{font-weight:800}.out.died{color:var(--bad)}.out.good{color:var(--good)}
details summary{cursor:pointer;color:var(--mut);padding:6px 0}
ul{margin:6px 0;padding-left:18px}
.fixed{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);background:linear-gradient(transparent,var(--bg) 35%)}
.fixed>div{max-width:640px;margin:0 auto;display:flex;gap:8px}
</style>
<style>
.scene{background:linear-gradient(#0d2a37,#0a1d27);border:1px solid var(--line);border-radius:18px;padding:8px;margin:8px 0;position:relative;overflow:hidden}
.scene svg{width:100%;height:auto;display:block}
.scene.crit{box-shadow:0 0 0 2px var(--bad) inset;animation:flash 1s infinite}
@keyframes flash{50%{box-shadow:0 0 0 2px rgba(255,77,94,.2) inset}}
.mon{display:grid;grid-template-columns:1.2fr 1fr;gap:8px;margin:8px 0}
.mon .tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tile{background:#031017;border:1px solid var(--line);border-radius:10px;padding:5px 8px;font-family:ui-monospace,monospace}
.tile b{font-size:19px;color:#52d98a}.tile span{display:block;font-size:10px;color:var(--mut);text-transform:uppercase}.tile.w b{color:var(--warn)}.tile.r b{color:var(--bad)}
.bedc{display:grid;grid-template-columns:104px 1fr;gap:10px;align-items:center}
.bedc .av{background:#0a1d27;border-radius:12px;padding:2px}
.meter{height:9px;background:#031017;border-radius:6px;overflow:hidden;margin-top:6px;border:1px solid var(--line)}
.meter i{display:block;height:100%;transition:width .8s ease,background .8s}
.plan{position:absolute;top:8px;right:46px;background:var(--acc);color:#04201d;font:800 11px ui-monospace,monospace;border-radius:8px;padding:1px 6px}
canvas.mini{width:100%;height:26px;display:block;margin-top:5px}
.brett{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px 12px;margin:8px 0;font-size:13.5px}
.brett .face{font-size:30px}
.pop{position:fixed;inset:0;background:rgba(3,16,23,.9);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.pop .big{font-size:84px;animation:beat .5s infinite alternate}@keyframes beat{to{transform:scale(1.18)}}
.pop .dots::after{content:'';animation:dots 1s steps(4) infinite}@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.conf{position:fixed;top:-20px;width:9px;height:14px;z-index:70;animation:fall 2.6s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.8}}
.flat{background:#1a0509;border:1px solid var(--bad);border-radius:12px;padding:4px;margin:8px 0}
.ico{font-size:26px;width:40px;display:inline-block;text-align:center;vertical-align:middle}
.rk{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--acc);color:#04201d;font-weight:800;font-size:16px}
.rk.empty{background:var(--panel2);color:var(--mut);border:2px dashed var(--line)}
.stars{font-size:28px;text-align:center;letter-spacing:6px}
.hbeat{display:inline-block;animation:beat .6s infinite alternate}
</style>
</head>
<body>
<div id="app"></div>
<div class="toasts" id="toasts"></div>
<script src="cases.js"></script>
<script src="meta.js"></script>
<script>window.DAYDATA=[];</script>
<script src="day2.js"></script>
<script src="day3.js"></script>
<script src="day4.js"></script>
<script src="day5.js"></script>
<script src="day6.js"></script>
<script src="day7.js"></script>
<script src="days.js"></script>
<script src="game.js"></script>
</body>
</html>
